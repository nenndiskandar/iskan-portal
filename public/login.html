<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iskan Portal">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Iskan Portal">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Login · Iskan System Portal</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{base:'#09090b',surface:'#18181b',border:'#27272a',muted:'#a1a1aa',text:'#f4f4f5',accent:'#14b8a6',error:'#f43f5e',warn:'#f59e0b'}}}}</script>
<style>html{-webkit-text-size-adjust:100%}*:focus-visible{outline:2px solid #14b8a6;outline-offset:2px} body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}</style>
</head>
<body class="min-h-screen bg-base text-text font-sans antialiased flex items-center justify-center px-4 py-8 overflow-x-hidden">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6 sm:mb-7">
      <div class="inline-flex h-10 w-10 items-center justify-center rounded bg-surface border border-border mb-3 text-sm">⚡</div>
      <h1 class="text-xl font-semibold tracking-tight">Iskan System Portal</h1>
      <p class="text-sm text-muted mt-1">Masuk untuk akses dashboard</p>
    </div>
    <form id="login-form" class="rounded border border-border bg-surface/40 p-4 sm:p-5 space-y-4" autocomplete="off" novalidate>
      <div>
        <label for="password" class="block text-xs font-medium text-muted uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <input id="password" type="password" required autofocus placeholder="••••••••" autocomplete="current-password"
            class="w-full h-11 rounded bg-base border border-border pl-3 pr-11 text-sm text-text placeholder:text-muted/60 focus:border-accent focus:ring-1 focus:ring-accent outline-none" />
          <button type="button" id="toggle-pw" aria-label="Tampilkan password" aria-pressed="false"
            class="absolute right-1 top-1/2 -translate-y-1/2 h-9 w-9 inline-flex items-center justify-center rounded text-muted hover:text-text hover:bg-surface active:bg-zinc-800 transition">
            <svg id="icon-eye" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3.5"/></svg>
            <svg id="icon-eye-off" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3 21 21"/><path d="M10.6 10.6A3.5 3.5 0 0 0 13.4 13.4"/><path d="M9.5 7.1A10.9 10.9 0 0 1 12 5C19 5 23 12 23 12a17.4 17.4 0 0 1-3.6 4.8"/><path d="M12 19C5 19 1 12 1 12a17.4 17.4 0 0 1 5.2-5.9"/></svg>
          </button>
        </div>
        <p class="text-[11px] text-muted mt-1.5 leading-relaxed">Default: <code class="bg-base px-1 py-0.5 rounded border border-border/40 font-mono">iskan2026</code> · ganti setelah login via <span class="text-text/80">Ganti Password</span>.</p>
      </div>
      <div id="error" class="hidden rounded bg-error/10 border border-error/20 text-error text-sm px-3 py-2 break-words" role="alert"></div>
      <button id="btn-login" type="submit" class="w-full h-11 rounded bg-text text-base font-medium text-base hover:bg-white active:bg-zinc-200 transition flex items-center justify-center gap-2">
        <span id="btn-label">Masuk</span>
        <svg id="btn-spinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      </button>
      <p class="text-center text-[11px] text-muted">Enter untuk masuk · Esc untuk kosongkan</p>
    </form>
    <p class="text-center text-xs text-muted mt-4">Protected · portal.nendi.web.id · Cloudflare Tunnel 204640e4</p>
  </div>
<script>
(function(){
  var form=document.getElementById('login-form');
  var inp=document.getElementById('password');
  var err=document.getElementById('error');
  var btn=document.getElementById('btn-login');
  var label=document.getElementById('btn-label');
  var spin=document.getElementById('btn-spinner');
  var toggle=document.getElementById('toggle-pw');
  var eye=document.getElementById('icon-eye');
  var eyeOff=document.getElementById('icon-eye-off');
  function setEye(show){
    inp.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
    if(show){ eye.classList.add('hidden'); eyeOff.classList.remove('hidden'); } else { eye.classList.remove('hidden'); eyeOff.classList.add('hidden'); }
  }
  toggle.addEventListener('click', function(){ setEye(inp.type === 'password'); inp.focus(); });
  toggle.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setEye(inp.type==='password'); }});
  // if already authed, redirect
  fetch('/api/auth/check',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){ if(d.authenticated) location.href='/'; }).catch(function(){});
  function showErr(msg){ err.textContent=msg; err.classList.remove('hidden'); }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pwd=inp.value.trim();
    if(!pwd) { showErr('Password wajib diisi'); inp.focus(); return; }
    err.classList.add('hidden');
    btn.disabled=true; label.textContent='Memeriksa...'; spin.classList.remove('hidden');
    fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,body:j}; }); })
      .then(function(res){
        if(res.ok && res.body.ok){ location.href='/'; return; }
        showErr(res.body.error || 'Gagal login');
        btn.disabled=false; label.textContent='Masuk'; spin.classList.add('hidden');
        inp.select();
      }).catch(function(ex){
        showErr('Network error: '+(ex.message||ex));
        btn.disabled=false; label.textContent='Masuk'; spin.classList.add('hidden');
      });
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && document.activeElement===inp){ inp.value=''; err.classList.add('hidden'); }});
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js'); }); }
</script>
</body>
</html>
